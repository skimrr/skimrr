name: Build Windows

# Builds skimrr.exe and the NSIS installer on a real Windows runner.
# Use this when a cross-build from macOS is not available.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # candle-onnx's build script generates code from .proto files at compile
      # time and needs protoc on PATH — not preinstalled on windows-latest.
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - run: cargo test --manifest-path src-tauri/Cargo.toml

      - run: npm run tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: skimrr-windows
          path: |
            src-tauri/target/release/skimrr.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      # Store-ready MSIX, Store-signed on submission — no certificate purchase
      # needed. Kept as its own build (--no-bundle under the hood) rather than
      # reused from the NSIS build above, since MSIX needs its own manifest/assets.
      # --runner npm: the default runner shells out to `cargo tauri`, the Rust-side
      # CLI, which isn't installed here (only the npm one, via @tauri-apps/cli).
      - run: npm run tauri:windows:build -- --runner npm

      # Two submissions were rejected under Store policy 10.1.1.11 because a tile
      # shipped as a flat colour — the bundler writes that silently when it has no
      # source for a size, so the build passed and the defect surfaced days later as a
      # rejection. Checked here instead, on the finished bundle, before it can be
      # downloaded and uploaded to the Store.
      - name: Verify tiles are not placeholders
        shell: bash
        run: |
          python -m pip install --quiet pillow
          python tools/msix-tiles/check_bundle.py src-tauri/target/msix/*.msixbundle

      - uses: actions/upload-artifact@v4
        with:
          name: skimrr-msix
          path: src-tauri/target/msix/*
          if-no-files-found: error
